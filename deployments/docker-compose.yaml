name: ledger-hub

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: ledger-hub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ledger_hub
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ledger_hub_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: api
    container_name: ledger-hub-api
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/livez"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: gateway
    container_name: ledger-hub-gateway
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/livez"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: worker
    container_name: ledger-hub-worker
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8089/livez"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  connector:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: connector
    container_name: ledger-hub-connector
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/livez"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  ledger_hub_mysql:
