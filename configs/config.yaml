app:
  name: ledger-hub
  env: local
  default_tenant: t_default
  reconcile_dir: data/reconcile

http:
  api_addr: ":8080"
  gateway_addr: ":8088"
  worker_addr: ":8089"
  read_timeout: 10s
  write_timeout: 15s
  shutdown_timeout: 10s

mysql:
  dsn: "root:root@tcp(127.0.0.1:3306)/ledger_hub?charset=utf8mb4&parseTime=True&loc=Local"
  shards: [] # 额外分片 DSN；空则单库。账户/流水/冻结/幂等按 holder_id 哈希
  max_idle_conns: 10
  max_open_conns: 50
  conn_max_lifetime: 30m
  auto_migrate: true # 生产请设 false，改用 ledger-migrate

log:
  level: debug
  encoding: console

gateway:
  upstream: "http://127.0.0.1:8080"
  rate_limit_rps: 200
  max_skew_seconds: 300
  console_token: "dev-console-token"
  default_tenant: t_default
  accept_sign_versions: [v1, v2]
  clients:
    - client_id: order
      secret: "dev-secret-order"
      rate_limit_rps: 80
      tenants: [t_default, t_mall, t_game]
    - client_id: pay
      secret: "dev-secret-pay"
      rate_limit_rps: 80
      tenants: [t_default, t_mall, t_game]
    - client_id: campaign
      secret: "dev-secret-campaign"
      tenants: [t_default, t_mall, t_game]
    - client_id: wallet
      secret: "dev-secret-wallet"
      tenants: [t_default, t_mall, t_game]

acl:
  rules:
    - source_system: campaign
      commands: ["Credit"]
      assets: ["POINT", "COIN"]
    - source_system: order
      commands: ["Freeze", "Capture", "Release"]
      assets: ["POINT", "BALANCE_CNY", "BALANCE_USD", "BALANCE_HKD", "COIN", "VOUCHER"]
    - source_system: pay
      commands: ["Credit"]
      assets: ["BALANCE_CNY", "BALANCE_USD", "BALANCE_HKD"]
    - source_system: wallet
      commands: ["Credit", "Debit", "Freeze", "Capture", "Release", "Transfer", "Exchange", "Reverse"]
      assets: ["POINT", "BALANCE_CNY", "BALANCE_USD", "BALANCE_HKD", "COIN", "VOUCHER", "MILEAGE"]
    - source_system: worker
      commands: ["Release", "Debit", "Transfer", "Reverse"]
      assets: ["*"]

connector:
  addr: ":8090"
  ledger_base_url: "http://127.0.0.1:8088"
  mq_dir: data/mq
  mq_interval: 2s
  kafka:
    brokers: []
    topic: ledger-events
    group_id: ledger-connector

worker:
  freeze_expire_interval: 30s
  reconcile_interval: 1h
  asset_expire_interval: 24h
  fx_feed_interval: 1h
  idempotency_interval: 1h
  idempotency_retain: 192h
  saga_interval: 15s
  lease_ttl: 30s
  fx_feed:
    - base_asset: BALANCE_CNY
      quote_asset: BALANCE_USD
      rate: "0.14000000"

limits:
  rules:
    - source_system: wallet
      asset_code: "*"
      command: Exchange
      max_amount: 100000000
      daily_amount: 1000000000
      daily_count: 1000
    - source_system: wallet
      asset_code: POINT
      command: Debit
      max_amount: 80
