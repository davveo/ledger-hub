<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Ledger Hub 后台</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #020617; --panel: #0f172a; --panel-2: #111827; --line: #1e293b;
      --text: #e2e8f0; --muted: #94a3b8; --cyan: #22d3ee; --emerald: #34d399;
      --amber: #fbbf24; --rose: #fb7185; --violet: #a78bfa; --btn: #1f6feb;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: "Noto Sans SC", ui-sans-serif, system-ui, sans-serif; }
    button, input, select, textarea { font: inherit; }
    a { color: var(--cyan); }
    code, .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
    .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100%; }
    .side { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 12px; position: sticky; top: 0; height: 100vh; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 18px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
    .brand h1 { margin: 0; font-size: 15px; letter-spacing: .02em; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
    nav a { display: block; color: var(--muted); text-decoration: none; padding: 9px 12px; border-radius: 8px; margin: 2px 0; font-size: 13px; }
    nav a:hover, nav a.active { background: #1e293b; color: var(--text); }
    .main { display: flex; flex-direction: column; min-width: 0; }
    header.top { display: flex; gap: 10px; align-items: center; padding: 14px 22px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    header.top h2 { margin: 0; font-size: 16px; flex: 1; }
    .content { padding: 20px 22px 56px; display: grid; gap: 16px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
    .card h3 { margin: 0 0 12px; font-size: 14px; color: var(--muted); font-weight: 600; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .row:last-child { margin-bottom: 0; }
    input, select, textarea { background: #020617; color: inherit; border: 1px solid #334155; border-radius: 8px; padding: 8px 10px; min-width: 140px; }
    textarea { width: 100%; min-height: 72px; }
    button { background: var(--btn); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
    button.ghost { background: transparent; border: 1px solid #334155; color: var(--text); }
    button.warn { background: #9f1239; }
    button.ok { background: #065f46; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .muted { color: var(--muted); font-size: 12px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .stat .k { color: var(--muted); font-size: 12px; }
    .stat .v { font-size: 22px; margin-top: 6px; font-family: "JetBrains Mono", monospace; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { color: var(--muted); font-weight: 500; font-size: 12px; }
    td.mono { font-size: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
    .b-active, .b-done, .b-resolved, .b-captured { background: rgba(52,211,153,.15); color: var(--emerald); }
    .b-disabled, .b-failed, .b-open, .b-missing { background: rgba(251,113,133,.15); color: var(--rose); }
    .b-frozen, .b-running { background: rgba(251,191,36,.15); color: var(--amber); }
    .b-released { background: rgba(148,163,184,.15); color: var(--muted); }
    .toast { position: fixed; right: 18px; bottom: 18px; background: #1e293b; border: 1px solid #334155; padding: 10px 14px; border-radius: 10px; max-width: 420px; display: none; font-size: 13px; z-index: 30; box-shadow: 0 16px 40px rgba(0,0,0,.35); }
    .toast.show { display: block; }
    .toast.err { border-color: var(--rose); }
    .modal-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: rgba(2,6,23,.76); backdrop-filter: blur(5px); opacity: 0; visibility: hidden; transition: opacity .16s ease, visibility .16s ease; }
    .modal-backdrop.show { opacity: 1; visibility: visible; }
    .modal { width: min(440px, 100%); overflow: hidden; background: linear-gradient(145deg, #111c32, #0f172a); border: 1px solid #334155; border-radius: 16px; box-shadow: 0 28px 80px rgba(0,0,0,.55); transform: translateY(10px) scale(.98); transition: transform .18s ease; }
    .modal-backdrop.show .modal { transform: translateY(0) scale(1); }
    .modal-head { display: flex; gap: 12px; align-items: flex-start; padding: 20px 20px 8px; }
    .modal-icon { flex: 0 0 auto; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: rgba(34,211,238,.12); color: var(--cyan); font-size: 18px; }
    .modal.danger .modal-icon { background: rgba(251,113,133,.13); color: var(--rose); }
    .modal-copy { min-width: 0; flex: 1; }
    .modal-title { margin: 0; color: #f8fafc; font-size: 16px; font-weight: 600; }
    .modal-message { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }
    .modal-body { padding: 12px 20px 4px; }
    .modal-body input { width: 100%; min-width: 0; }
    .modal-hint { margin: 7px 2px 0; color: var(--muted); font-size: 11px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; padding: 18px 20px 20px; }
    .modal-actions button { min-width: 76px; }
    .modal-actions .danger-btn { background: #be123c; }
    .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .login .card { width: min(420px, 100%); }
    .hidden { display: none !important; }
    .pager { display: flex; gap: 8px; align-items: center; }
    @media (max-width: 860px) { .app { grid-template-columns: 1fr; } .side { position: static; height: auto; } }
  </style>
</head>
<body>
<div id="login" class="login hidden">
  <div class="card">
    <div class="brand" style="border:0;padding:0 0 12px;margin:0">
      <span class="dot"></span>
      <div><h1>Ledger Hub 后台</h1><p>运营控制台</p></div>
    </div>
    <p class="muted">经网关访问时填写 <code>gateway.console_token</code>（本地默认 <code>dev-console-token</code>）。直连 API :8080 可不填。操作人会写入冲正 / 关差异 / 作业审计。</p>
    <div class="row" style="margin-top:12px">
      <input id="loginToken" placeholder="X-Console-Token" style="flex:1;min-width:0"/>
    </div>
    <div class="row">
      <input id="loginOp" placeholder="操作人，如 ops_zhang" style="flex:1;min-width:0"/>
      <button onclick="unlock()">进入</button>
    </div>
  </div>
</div>
<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand">
      <span class="dot"></span>
      <div><h1>Ledger Hub</h1><p>运营后台</p></div>
    </div>
    <nav>
      <a href="#/dashboard" data-page="dashboard">概览</a>
      <a href="#/assets" data-page="assets">资产</a>
      <a href="#/tenants" data-page="tenants">租户</a>
      <a href="#/accounts" data-page="accounts">账户</a>
      <a href="#/entries" data-page="entries">流水</a>
      <a href="#/freezes" data-page="freezes">冻结单</a>
      <a href="#/fx" data-page="fx">汇率</a>
      <a href="#/reconcile" data-page="reconcile">对账</a>
      <a href="#/jobs" data-page="jobs">作业</a>
      <a href="#/audit" data-page="audit">审计</a>
      <a href="#/risk" data-page="risk">风控</a>
    </nav>
  </aside>
  <section class="main">
    <header class="top">
      <h2 id="title">概览</h2>
      <select id="tenantSel" onchange="onTenant()"></select>
      <input id="operator" placeholder="操作人" style="min-width:120px"/>
      <input id="token" placeholder="Console Token" style="min-width:180px"/>
      <button class="ghost" onclick="saveSession()">保存</button>
    </header>
    <div class="content" id="view"></div>
  </section>
</div>
<div id="toast" class="toast"></div>
<div id="modalBackdrop" class="modal-backdrop" aria-hidden="true">
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalMessage">
    <div class="modal-head">
      <div id="modalIcon" class="modal-icon" aria-hidden="true">✓</div>
      <div class="modal-copy">
        <h3 id="modalTitle" class="modal-title"></h3>
        <p id="modalMessage" class="modal-message"></p>
      </div>
    </div>
    <div id="modalBody" class="modal-body hidden">
      <input id="modalInput" autocomplete="off"/>
      <p id="modalHint" class="modal-hint"></p>
    </div>
    <div class="modal-actions">
      <button id="modalCancel" class="ghost" type="button">取消</button>
      <button id="modalConfirm" type="button">确认</button>
    </div>
  </div>
</div>
<script>
const TOKEN_KEY = 'ledger_console_token';
const TENANT_KEY = 'ledger_console_tenant';
const OP_KEY = 'ledger_console_operator';
const titles = {dashboard:'概览', assets:'资产', tenants:'租户', accounts:'账户', entries:'流水', freezes:'冻结单', fx:'汇率', reconcile:'对账', jobs:'作业', audit:'审计', risk:'风控'};
let overview = {};
let entryOffset = 0;
const entryLimit = 50;

function $(id) { return document.getElementById(id); }
function page() { return (location.hash.replace(/^#\/?/, '') || 'dashboard').split('?')[0]; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function v(row, ...keys) {
  if (!row) return '';
  for (const k of keys) {
    if (row[k] != null && row[k] !== '') return row[k];
    const found = Object.keys(row).find(x => x.toLowerCase() === k.toLowerCase().replace(/_/g, ''));
    if (found && row[found] != null && row[found] !== '') return row[found];
  }
  return '';
}
function badge(st) {
  const s = String(st || '').toLowerCase();
  return `<span class="badge b-${esc(s)}">${esc(st || '-')}</span>`;
}
function toast(msg, err) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 3200);
}
function openModal(opt) {
  const backdrop = $('modalBackdrop');
  const modal = $('modal');
  const input = $('modalInput');
  const hasInput = opt.input !== undefined;
  $('modalTitle').textContent = opt.title || '请确认';
  $('modalMessage').textContent = opt.message || '';
  $('modalIcon').textContent = opt.danger ? '!' : (hasInput ? '¥' : '✓');
  $('modalBody').classList.toggle('hidden', !hasInput);
  $('modalHint').textContent = opt.hint || '';
  input.value = hasInput ? String(opt.input || '') : '';
  input.placeholder = opt.placeholder || '';
  modal.classList.toggle('danger', !!opt.danger);
  $('modalConfirm').className = opt.danger ? 'danger-btn' : '';
  $('modalConfirm').textContent = opt.confirmText || '确认';
  backdrop.setAttribute('aria-hidden', 'false');
  backdrop.classList.add('show');
  return new Promise(resolve => {
    let done = false;
    const finish = value => {
      if (done) return;
      done = true;
      backdrop.classList.remove('show');
      backdrop.setAttribute('aria-hidden', 'true');
      document.removeEventListener('keydown', onKey);
      backdrop.removeEventListener('click', onBackdrop);
      setTimeout(() => resolve(value), 120);
    };
    const onKey = e => {
      if (e.key === 'Escape') finish(null);
      if (e.key === 'Enter' && !e.isComposing) finish(hasInput ? input.value : true);
    };
    const onBackdrop = e => { if (e.target === backdrop) finish(null); };
    $('modalCancel').onclick = () => finish(null);
    $('modalConfirm').onclick = () => finish(hasInput ? input.value : true);
    document.addEventListener('keydown', onKey);
    backdrop.addEventListener('click', onBackdrop);
    requestAnimationFrame(() => (hasInput ? input : $('modalConfirm')).focus());
  });
}
function confirmDialog(title, message, opt) {
  return openModal(Object.assign({title, message}, opt || {}));
}
function promptDialog(title, message, opt) {
  return openModal(Object.assign({title, message, input: ''}, opt || {}));
}
function headers(json) {
  const h = {};
  if (json) h['Content-Type'] = 'application/json';
  const t = localStorage.getItem(TOKEN_KEY);
  if (t) h['X-Console-Token'] = t;
  const tenant = localStorage.getItem(TENANT_KEY);
  if (tenant) h['X-Tenant-Id'] = tenant;
  const op = localStorage.getItem(OP_KEY);
  if (op) h['X-Operator'] = op;
  return h;
}
function prec(asset) {
  const a = (overview.assets || []).find(x => v(x, 'asset_code') === asset);
  const p = a ? Number(v(a, 'precision')) : 0;
  return Number.isFinite(p) && p > 0 ? p : 0;
}
function fmtAmt(asset, raw) {
  if (raw == null || raw === '') return '';
  const n = Number(raw);
  if (!Number.isFinite(n)) return String(raw);
  const p = prec(asset);
  if (p <= 0) return String(Math.trunc(n));
  const neg = n < 0;
  const abs = Math.abs(Math.trunc(n));
  let scale = 1;
  for (let i = 0; i < p; i++) scale *= 10;
  const whole = Math.floor(abs / scale);
  const frac = String(abs % scale).padStart(p, '0');
  return (neg ? '-' : '') + whole + '.' + frac;
}
async function api(path, opt) {
  const r = await fetch(path, Object.assign({headers: headers(opt && opt.body)}, opt || {}));
  if (r.status === 401) {
    showLogin();
    throw new Error('未授权');
  }
  const ct = r.headers.get('content-type') || '';
  if (!ct.includes('json')) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r;
  }
  const j = await r.json();
  if (j.code && j.code !== 0) throw new Error(j.message || ('错误 ' + j.code));
  return j;
}
function table(cols, rows, render) {
  if (!rows || !rows.length) return '<p class="muted">暂无数据</p>';
  const head = cols.map(c => `<th>${esc(c.label)}</th>`).join('');
  const body = rows.map(row => {
    const tds = cols.map(c => {
      const raw = c.value ? c.value(row) : v(row, c.key);
      return `<td class="${c.mono ? 'mono' : ''}">${c.html ? raw : esc(raw)}</td>`;
    }).join('');
    return `<tr>${tds}${render ? `<td>${render(row)}</td>` : ''}</tr>`;
  }).join('');
  return `<div style="overflow:auto"><table><thead><tr>${head}${render ? '<th></th>' : ''}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function showLogin() {
  $('login').classList.remove('hidden');
  $('app').classList.add('hidden');
  $('loginToken').value = localStorage.getItem(TOKEN_KEY) || 'dev-console-token';
  if ($('loginOp')) $('loginOp').value = localStorage.getItem(OP_KEY) || 'console';
}
function unlock() {
  localStorage.setItem(TOKEN_KEY, $('loginToken').value.trim());
  localStorage.setItem(OP_KEY, ($('loginOp') && $('loginOp').value.trim()) || 'console');
  boot();
}
function saveSession() {
  localStorage.setItem(TOKEN_KEY, $('token').value.trim());
  localStorage.setItem(OP_KEY, ($('operator') && $('operator').value.trim()) || 'console');
  toast('已保存 Token / 操作人');
  loadOverview().then(render);
}
function saveToken() { saveSession(); }
function onTenant() {
  localStorage.setItem(TENANT_KEY, $('tenantSel').value);
  loadOverview().then(render);
}

async function loadOverview() {
  const j = await api('/api/v1/ledger/console/overview');
  overview = j.data || {};
  fillTenants(overview.tenants || []);
  return overview;
}
function fillTenants(list) {
  const sel = $('tenantSel');
  const cur = localStorage.getItem(TENANT_KEY) || overview.tenant_id || '';
  if (!list.length && cur) list = [{tenant_id: cur, name: cur, status: 'active'}];
  sel.innerHTML = list.map(t => {
    const id = v(t, 'tenant_id');
    return `<option value="${esc(id)}" ${id === cur ? 'selected' : ''}>${esc(v(t, 'name') || id)}</option>`;
  }).join('');
  if (sel.value && sel.value !== localStorage.getItem(TENANT_KEY)) localStorage.setItem(TENANT_KEY, sel.value);
}

function render() {
  const p = page();
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.page === p));
  $('title').textContent = titles[p] || '概览';
  const fn = ({dashboard: viewDash, assets: viewAssets, tenants: viewTenants, accounts: viewAccounts,
    entries: viewEntries, freezes: viewFreezes, fx: viewFx, reconcile: viewRecon, jobs: viewJobs,
    audit: viewAudit, risk: viewRisk})[p] || viewDash;
  $('view').innerHTML = fn();
  const run = (f) => f().catch(e => toast(e.message || String(e), true));
  if (p === 'entries') run(() => searchEntries(false));
  if (p === 'accounts') run(() => searchAccounts());
  if (p === 'freezes') run(() => loadFreezeQueues());
  if (p === 'reconcile') run(() => refreshRecon());
  if (p === 'jobs') run(() => loadJobs());
  if (p === 'audit') run(() => loadAudit());
  if (p === 'risk') run(() => loadConfigRevisions());
}

function viewDash() {
  const d = overview;
  const alerts = d.alerts || [];
  return `
    <div class="stats">
      <div class="stat"><div class="k">租户</div><div class="v">${(d.tenants||[]).length}</div></div>
      <div class="stat"><div class="k">资产</div><div class="v">${(d.assets||[]).length}</div></div>
      <div class="stat"><div class="k">账户</div><div class="v">${(d.accounts||[]).length}</div></div>
      <div class="stat"><div class="k">汇率快照</div><div class="v">${(d.fx_rates||[]).length}</div></div>
      <div class="stat"><div class="k">限额告警</div><div class="v">${alerts.length}</div></div>
    </div>
    <div class="card"><h3>最近限额告警</h3>${table(
      [{label:'时间', key:'at'}, {label:'持有人', key:'holder_id', mono:true}, {label:'资产', key:'asset_code'}, {label:'命令', key:'command'}, {label:'原因', key:'reason'}],
      alerts.slice(0, 8)
    )}</div>
    <div class="card"><h3>资产</h3>${table(
      [{label:'代码', key:'asset_code', mono:true}, {label:'名称', key:'name'}, {label:'类型', key:'asset_class'}, {label:'精度', key:'precision'}, {label:'状态', html:true, value: r => badge(v(r,'status'))}],
      (d.assets||[]).slice(0, 8)
    )}</div>`;
}

function viewAssets() {
  return `
    <div class="card">
      <h3>登记 / 启停</h3>
      <div class="row">
        <input id="assetCode" placeholder="asset_code 如 POINT"/>
        <input id="assetName" placeholder="名称"/>
        <input id="assetClass" placeholder="asset_class 如 point / fiat"/>
        <input id="assetHolders" placeholder="holder_types 逗号分隔" value="user,merchant"/>
        <label class="muted"><input type="checkbox" id="assetFreeze" checked/> 支持冻结</label>
        <button onclick="saveAsset()">登记</button>
        <button class="warn" onclick="assetStatus('disable')">下线</button>
        <button class="ok" onclick="assetStatus('enable')">启用</button>
      </div>
    </div>
    <div class="card"><h3>资产列表</h3>${table(
      [{label:'代码', key:'asset_code', mono:true}, {label:'名称', key:'name'}, {label:'类型', key:'asset_class'},
       {label:'精度', key:'precision'}, {label:'持有人', value: r => (v(r,'holder_types') || []).toString()},
       {label:'冻结', value: r => v(r,'freeze_supported') ? '是' : '否'},
       {label:'状态', html:true, value: r => badge(v(r,'status'))}],
      overview.assets || [],
      r => `<button class="ghost" onclick="fillAsset('${esc(v(r,'asset_code'))}')">选用</button>`
    )}</div>`;
}

function viewTenants() {
  return `
    <div class="card">
      <h3>保存 / 启停</h3>
      <div class="row">
        <input id="tenantId" placeholder="tenant_id"/>
        <input id="tenantName" placeholder="名称"/>
        <button onclick="saveTenant()">保存</button>
        <button class="warn" onclick="tenantStatus('disable')">停用</button>
        <button class="ok" onclick="tenantStatus('enable')">启用</button>
      </div>
    </div>
    <div class="card"><h3>租户列表</h3>${table(
      [{label:'ID', key:'tenant_id', mono:true}, {label:'名称', key:'name'}, {label:'状态', html:true, value: r => badge(v(r,'status'))}],
      overview.tenants || [],
      r => `<button class="ghost" onclick="fillTenant('${esc(v(r,'tenant_id'))}','${esc(v(r,'name'))}')">选用</button>`
    )}</div>`;
}

function viewAccounts() {
  return `
    <div class="card">
      <h3>检索 / 开户</h3>
      <div class="row">
        <input id="holderId" placeholder="holder_id"/>
        <select id="holderType"><option>user</option><option>merchant</option><option>system_subject</option></select>
        <input id="qAsset" placeholder="asset_code 可空"/>
        <button onclick="searchAccounts()">查询</button>
        <button class="ghost" onclick="openAccount()">开户</button>
      </div>
      <p class="muted">不填 holder 时列出当前租户账户。行内可停用 / 启用，禁止再记账。</p>
    </div>
    <div class="card"><h3>账户</h3><div id="accTable"><p class="muted">加载中…</p></div></div>`;
}

function viewEntries() {
  return `
    <div class="card">
      <h3>检索流水</h3>
      <div class="row">

async function searchAccounts() {
  const q = new URLSearchParams();
  const holder = $('holderId') && $('holderId').value;
  if (holder) { q.set('holder_id', holder); q.set('holder_type', $('holderType').value); }
  const asset = $('qAsset') && $('qAsset').value;
  if (asset) q.set('asset_code', asset);
  const j = await api('/api/v1/ledger/accounts?' + q.toString());
  const rows = Array.isArray(j.data) ? j.data : (j.data ? [j.data] : []);
  $('accTable').innerHTML = table(
    [{label:'账户', key:'account_id', mono:true}, {label:'持有人', key:'holder_id', mono:true}, {label:'类型', key:'holder_type'},
     {label:'资产', key:'asset_code'},
     {label:'可用', html:true, mono:true, value: r => esc(fmtAmt(v(r,'asset_code'), v(r,'available')))},
     {label:'冻结', html:true, mono:true, value: r => esc(fmtAmt(v(r,'asset_code'), v(r,'frozen')))},
     {label:'状态', html:true, value: r => badge(v(r,'status'))}],
    rows,
    r => {
      const id = v(r,'account_id');
      const st = String(v(r,'status'));
      const op = st === 'disabled' ? 'enable' : 'disable';
      return `<button class="ghost" onclick="setAcc('${esc(id)}','${op}')">${op === 'disable' ? '停用' : '启用'}</button>
        <button class="ghost" onclick="gotoEntries('${esc(v(r,'holder_id'))}','${esc(v(r,'holder_type'))}','${esc(v(r,'asset_code'))}')">流水</button>`;
    }
  );
}

  })});

async function setAcc(id, op) {

}
function gotoEntries(holder, type, asset) {
  location.hash = '#/entries';
  setTimeout(() => {
    if ($('eHolder')) { $('eHolder').value = holder; $('eType').value = type || 'user'; $('eAsset').value = asset || ''; searchEntries(); }
  }, 0);
}

async function searchEntries(keep) {
  if (!keep) entryOffset = entryOffset || 0;
  const biz = $('eBiz') && $('eBiz').value;
  let rows = [];
  if (biz) {
    const j = await api('/api/v1/ledger/entries?biz_no=' + encodeURIComponent(biz));
    rows = j.data || [];
  } else if ($('eHolder') && $('eHolder').value) {
    const q = new URLSearchParams({holder_id: $('eHolder').value, holder_type: $('eType').value, limit: String(entryLimit), offset: String(entryOffset)});
    if ($('eAsset').value) q.set('asset_code', $('eAsset').value);
    const j = await api('/api/v1/ledger/entries?' + q.toString());
    rows = (j.data && j.data.items) || [];
  }
  if ($('entryPage')) $('entryPage').textContent = 'offset ' + entryOffset;
  if (!$('entryTable')) return;
  $('entryTable').innerHTML = table(
    [{label:'时间', key:'created_at'}, {label:'命令', key:'command'}, {label:'方向', key:'direction'},
     {label:'资产', key:'asset_code'},
     {label:'金额', html:true, mono:true, value: r => esc(fmtAmt(v(r,'asset_code'), v(r,'amount')))},
     {label:'biz_no', key:'biz_no', mono:true},
     {label:'journal', key:'journal_id', mono:true},
     {label:'余额后', html:true, mono:true, value: r => esc(fmtAmt(v(r,'asset_code'), v(r,'available_after')))}],
    rows,
    r => `<button class="ghost" onclick="showJournal('${esc(v(r,'journal_id'))}')">凭证</button>
          <button class="ghost" onclick="prepReverse('${esc(v(r,'biz_no'))}','${esc(v(r,'source_system'))}')">冲正</button>`
  );
}
function pageEntries(dir) {
  entryOffset = Math.max(0, entryOffset + dir * entryLimit);
  searchEntries(true);
}
function prepReverse(biz, src) {
  $('revBiz').value = biz;
  if (src) $('revSrc').value = src;
}
async function showJournal(id) {
  if (!id) { $('journalBox').textContent = '无 journal_id'; return; }
  const j = await api('/api/v1/ledger/journals/' + encodeURIComponent(id));
  $('journalBox').textContent = JSON.stringify(j.data, null, 2);
}
async function doReverse() {
  const related = $('revBiz').value;
  const biz = $('revNew').value || ('ops:reverse:' + related + ':' + Date.now());
  const j = await api('/api/v1/ledger/commands/reverse', {method:'POST', body: JSON.stringify({
    source_system: $('revSrc').value, biz_no: biz, related_biz_no: related
  })});
  toast('冲正已受理 ' + (j.data && j.data.journal_id || ''));
  searchEntries();
}

async function searchFreezes() {
  if (!$('fHolder') || !$('fHolder').value) { if ($('fzTable')) $('fzTable').innerHTML = '<p class="muted">填写 holder_id 后查询，或看上方队列</p>'; return; }
  const q = new URLSearchParams({holder_id: $('fHolder').value, holder_type: $('fType').value});
  if ($('fAsset').value) q.set('asset_code', $('fAsset').value);
  if ($('fStatus').value) q.set('status', $('fStatus').value);
  const j = await api('/api/v1/ledger/freezes?' + q.toString());
  const rows = (j.data && j.data.items) || (Array.isArray(j.data) ? j.data : []);
  $('fzTable').innerHTML = freezeTable(rows, false);
}

function freezeActions(r, expired) {
  const st = String(v(r,'status'));
  if (st !== 'frozen') return '';
  const id = esc(v(r,'freeze_id'));
  const asset = esc(v(r,'asset_code'));
  const amt = esc(v(r,'amount'));
  const src = expired ? 'worker' : 'order';
  return `<button class="ok" onclick="doCapture('${id}','${asset}','${amt}')">确认</button>
    <button class="warn" onclick="doRelease('${id}','${asset}','${src}')">释放</button>`;
}
function freezeTable(rows, expired) {
  return table(
    [{label:'Freeze ID', key:'freeze_id', mono:true}, {label:'账户', key:'account_id', mono:true}, {label:'biz_no', key:'biz_no', mono:true},
     {label:'资产', key:'asset_code'},
     {label:'金额', html:true, mono:true, value: r => esc(fmtAmt(v(r,'asset_code'), v(r,'amount')))},
     {label:'状态', html:true, value: r => badge(v(r,'status'))}, {label:'过期', key:'expire_at'}],
    rows,
    r => freezeActions(r, expired)
  );
}
async function loadFreezeQueues() {
  try {
    const j = await api('/api/v1/ledger/freezes?expired=1&limit=50');
    const rows = (j.data && j.data.items) || [];
    if ($('fzExpired')) $('fzExpired').innerHTML = freezeTable(rows, true);
  } catch (e) { if ($('fzExpired')) $('fzExpired').innerHTML = '<p class="muted">' + esc(e.message) + '</p>'; }
  try {
    const j = await api('/api/v1/ledger/freezes?status=frozen');
    const rows = (j.data && j.data.items) || [];
    if ($('fzFrozen')) $('fzFrozen').innerHTML = freezeTable(rows, false);
  } catch (e) { if ($('fzFrozen')) $('fzFrozen').innerHTML = '<p class="muted">' + esc(e.message) + '</p>'; }
  if ($('fHolder') && $('fHolder').value) searchFreezes().catch(e => toast(e.message, true));
}
async function doCapture(freezeId, asset, maxAmt) {
  const hint = fmtAmt(asset, maxAmt) + '（最小单位 ' + maxAmt + '）';
  const raw = await promptDialog('确认冻结金额', '请输入本次确认金额，留空将确认整单。', {
    placeholder: '留空表示整单确认',
    hint: '当前冻结：' + hint,
    confirmText: '确认入账'
  });
  if (raw == null) return;
  const body = {
    source_system: 'order', biz_type: 'ops_capture',
    biz_no: 'ops:capture:' + freezeId + ':' + Date.now(),
    freeze_id: freezeId, asset_code: asset
  };
  if (String(raw).trim()) body.amount = String(raw).trim();
  const j = await api('/api/v1/ledger/commands/capture', {method:'POST', body: JSON.stringify(body)});
  toast('已确认 ' + (j.data && j.data.freeze_id || freezeId));
  loadFreezeQueues();
}
async function doRelease(freezeId, asset, src) {
  const confirmed = await confirmDialog('释放冻结金额', '释放后，冻结金额将退回账户可用余额。\n冻结单：' + freezeId, {
    danger: true,
    confirmText: '确认释放'
  });
  if (!confirmed) return;
  const j = await api('/api/v1/ledger/commands/release', {method:'POST', body: JSON.stringify({
    source_system: src || 'order', biz_type: src === 'worker' ? 'freeze_expire' : 'ops_release',
    biz_no: 'ops:release:' + freezeId + ':' + Date.now(),
    freeze_id: freezeId, asset_code: asset
  })});
  toast('已释放 ' + (j.data && j.data.freeze_id || freezeId));
  loadFreezeQueues();
}

async function refreshRecon() {
  await loadOpenDiffs();
  try {

    const list = jobs.data || [];
    $('jobTable').innerHTML = table(
      [{label:'Job', key:'job_id', mono:true}, {label:'日期', key:'date'}, {label:'系统', key:'source_system'}, {label:'资产', key:'asset_code'},
       {label:'版本', key:'version'}, {label:'状态', html:true, value: r => badge(v(r,'status'))}, {label:'时间', key:'created_at'}],
      list,
      r => `<button class="ghost" onclick="openJob('${esc(v(r,'job_id'))}')">查看</button>
        <button class="ghost" onclick="rerunJob('${esc(v(r,'job_id'))}')">重跑</button>`
    );
  } catch (e) { $('jobTable').innerHTML = '<p class="muted">' + esc(e.message) + '</p>'; }
  try {
    const files = await api('/api/v1/ledger/reconcile/files');
    $('fileTable').innerHTML = table(
      [{label:'文件', key:'name', mono:true}, {label:'大小', key:'size'}, {label:'修改时间', key:'mod_time'}],
      files.data || [],
      r => `<button class="ghost" onclick="downloadFile('${esc(v(r,'name'))}')">下载</button>`
    );
  } catch (e) { $('fileTable').innerHTML = '<p class="muted">' + esc(e.message) + '</p>'; }
}
async function loadOpenDiffs() {
  if (!$('openDiffTable')) return;
  try {
    const j = await api('/api/v1/ledger/reconcile/diffs?limit=50');
    const rows = j.data || [];
    $('openDiffTable').innerHTML = table(
      [{label:'Diff', key:'diff_id', mono:true}, {label:'类型', key:'kind'}, {label:'biz_no', key:'biz_no', mono:true},
       {label:'资产', key:'asset_code'},
       {label:'业务金额', html:true, mono:true, value: r => esc(fmtAmt(v(r,'asset_code'), v(r,'biz_amount')))},
       {label:'账本金额', html:true, mono:true, value: r => esc(fmtAmt(v(r,'asset_code'), v(r,'ledger_amount')))},
       {label:'状态', html:true, value: r => badge(v(r,'status'))}],
      rows,
      r => v(r,'status') === 'open' ? `<button class="ghost" onclick="fillDiff('${esc(v(r,'diff_id'))}')">选用</button>` : ''
    );
  } catch (e) { $('openDiffTable').innerHTML = '<p class="muted">' + esc(e.message) + '</p>'; }
}
async function runRecon() {
  const body = {date: $('reconDate').value, source_system: $('reconSys').value, asset_code: $('reconAsset').value};
  const j = await api('/api/v1/ledger/reconcile/jobs', {method:'POST', body: JSON.stringify(body)});
  toast('对账已排队 ' + ((j.data && j.data.job_id) || '') + ' v' + ((j.data && j.data.version) || ''));
  refreshRecon();
}
async function rerunJob(id) {
  const j = await api('/api/v1/ledger/reconcile/jobs/' + encodeURIComponent(id) + '/rerun', {method:'POST', body:'{}'});
  toast('已强制新版本 ' + ((j.data && j.data.job_id) || ''));
  refreshRecon();
}
async function loadReport() {
  const date = $('reconDate').value;
  const q = new URLSearchParams();
  if ($('reconSys').value) q.set('source_system', $('reconSys').value);
  if ($('reconAsset').value) q.set('asset_code', $('reconAsset').value);
  const j = await api('/api/v1/ledger/reconcile/reports/' + encodeURIComponent(date) + '?' + q.toString());
  showReport(j.data);
}
async function openJob(id) {
  const j = await api('/api/v1/ledger/reconcile/jobs/' + encodeURIComponent(id));
  showReport(j.data);
}
function showReport(data) {
  const job = data && data.job || data || {};
  $('reconSum').textContent = JSON.stringify(job.summary || job, null, 2);
  const diffs = (data && data.diffs) || [];
  $('diffTable').innerHTML = table(
    [{label:'Diff', key:'diff_id', mono:true}, {label:'类型', key:'kind'}, {label:'biz_no', key:'biz_no', mono:true},
     {label:'业务金额', html:true, value: r => esc(fmtAmt(v(r,'asset_code'), v(r,'biz_amount')))},
     {label:'账本金额', html:true, value: r => esc(fmtAmt(v(r,'asset_code'), v(r,'ledger_amount')))},
     {label:'状态', html:true, value: r => badge(v(r,'status'))}],
    diffs,
    r => v(r,'status') === 'open' ? `<button class="ghost" onclick="fillDiff('${esc(v(r,'diff_id'))}')">选用</button>` : ''
  );
}
function fillDiff(id) { $('diffId').value = id; }
async function resolveDiff() {
  await api('/api/v1/ledger/reconcile/diffs/' + encodeURIComponent($('diffId').value) + '/resolve', {
    method:'POST', body: JSON.stringify({note: $('diffNote').value})
  });
  toast('差异已关闭');
  loadOpenDiffs().catch(() => {});
  if ($('reconDate').value) loadReport().catch(() => {});
}
async function assignDiff() {
  await api('/api/v1/ledger/reconcile/diffs/' + encodeURIComponent($('diffId').value) + '/assign', {
    method:'POST', body: JSON.stringify({assignee: $('diffAssignee').value, note: $('diffNote').value})
  });
  toast('已指派');
  loadOpenDiffs().catch(() => {});
}

async function reloadCfg() {
  const j = await api('/api/v1/ledger/ops/reload', {method:'POST', body:'{}'});
  toast('配置已重载');
  overview.limits = (j.data && j.data.limits) || overview.limits;
  overview.acl = (j.data && j.data.acl) || overview.acl;
  render();
  loadConfigRevisions().catch(() => {});
}
async function loadConfigRevisions() {
  if (!$('cfgRevLine')) return;
  try {
    const j = await api('/api/v1/ledger/ops/config/revisions?limit=1');
    const rows = j.data || [];
    const last = rows[0];
    if (last) $('cfgRevLine').textContent = '最近配置版本 v' + (last.version || '') + ' @ ' + (last.applied_at || '') + ' by ' + (last.operator || '');
    else $('cfgRevLine').textContent = '尚无配置版本记录';
  } catch (e) { $('cfgRevLine').textContent = e.message; }
}

async function loadJobs() {
  try {
    const j = await api('/api/v1/ledger/ops/jobs?limit=20');
    const payload = j.data || {};
    const rows = Array.isArray(payload) ? payload : (payload.items || []);
    const last = payload.last_success || {};
    const lastLine = Object.keys(last).map(k => k + '=' + last[k]).join(' · ');
    if ($('opsJobTable')) $('opsJobTable').innerHTML =
      (lastLine ? '<p class="muted">最后成功：' + esc(lastLine) + '</p>' : '') +
      table(
      [{label:'Run', key:'run_id', mono:true}, {label:'作业', key:'name'}, {label:'实例', key:'instance_id', mono:true},
       {label:'状态', html:true, value: r => badge(v(r,'status'))},
       {label:'尝试', key:'attempt'}, {label:'耗时ms', key:'duration_ms'},
       {label:'笔数', key:'count'}, {label:'错误', key:'last_error'}, {label:'详情', key:'detail'},
       {label:'开始', key:'started_at'}, {label:'结束', key:'finished_at'}],
      rows
    );
  } catch (e) { if ($('opsJobTable')) $('opsJobTable').innerHTML = '<p class="muted">' + esc(e.message) + '</p>'; }
  loadExpirePreview().catch(() => {});
  loadSagas().catch(() => {});
}
async function loadSagas() {
  if (!$('sagaTable')) return;
  const st = $('sagaStatus') ? $('sagaStatus').value : '';
  const q = new URLSearchParams({limit: '50'});
  if (st) q.set('status', st);
  try {
    const j = await api('/api/v1/ledger/ops/sagas?' + q.toString());
    const rows = j.data || [];
    $('sagaTable').innerHTML = table(
      [{label:'Saga', key:'saga_id', mono:true}, {label:'biz_no', key:'biz_no', mono:true},
       {label:'状态', html:true, value: r => badge(v(r,'status'))},
       {label:'From', value: r => v(r,'from_id')}, {label:'To', value: r => v(r,'to_id')},
       {label:'资产', key:'asset_code'}, {label:'金额', key:'amount', mono:true},
       {label:'重试', key:'retry_count'}, {label:'错误', key:'last_error'}],
      rows,
      r => {
        const id = esc(v(r,'saga_id'));
        const done = String(v(r,'status')) === 'completed';
        if (done) return '';
        return `<button class="ghost" onclick="retrySaga('${id}')">重试</button>
          <button class="warn" onclick="compensateSaga('${id}')">补偿</button>`;
      }
    );
  } catch (e) { $('sagaTable').innerHTML = '<p class="muted">' + esc(e.message) + '</p>'; }
}
async function retrySaga(id) {
  const j = await api('/api/v1/ledger/ops/sagas/' + encodeURIComponent(id) + '/retry', {method:'POST', body:'{}'});
  const sg = j.data || {};
  toast('Saga 重试 ' + (sg.status || ''));
  loadSagas();
  loadJobs();
}
async function compensateSaga(id) {
  const confirmed = await confirmDialog('补偿跨分片 Saga', '将对已转出腿执行冲正。Saga：' + id, {
    danger: true,
    confirmText: '确认补偿'
  });
  if (!confirmed) return;
  const j = await api('/api/v1/ledger/ops/sagas/' + encodeURIComponent(id) + '/compensate', {method:'POST', body:'{}'});
  const sg = j.data || {};
  toast('Saga 补偿 ' + (sg.status || ''));
  loadSagas();
  loadJobs();
}
async function downloadFile(name) {
  const r = await api('/api/v1/ledger/reconcile/files/' + encodeURIComponent(name));
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
async function runJob(name) {
  const body = name === 'reconcile' ? JSON.stringify({date: new Date().toISOString().slice(0,10)}) : '{}';
  const j = await api('/api/v1/ledger/ops/jobs/' + encodeURIComponent(name), {method:'POST', body});
  const run = j.data || {};
  toast((run.name || name) + ' ' + (run.status || '') + ' count=' + (run.count || 0));
  loadJobs();
}
async function loadExpirePreview() {
  if (!$('expirePreview')) return;
  const asOf = $('expireAsOf') && $('expireAsOf').value;
  const q = asOf ? ('?as_of=' + encodeURIComponent(asOf)) : '';
  const j = await api('/api/v1/ledger/ops/jobs/expire/preview' + q);
  const rows = j.data || [];
  $('expirePreview').innerHTML = table(
    [{label:'持有人', key:'holder_id', mono:true}, {label:'账户', key:'account_id', mono:true}, {label:'资产', key:'asset_code'},
     {label:'将过期', html:true, mono:true, value: r => esc(fmtAmt(v(r,'asset_code'), v(r,'amount')))},
     {label:'策略', key:'policy'}],
    rows
  );
}

async function loadAudit() {
  try {
    const j = await api('/api/v1/ledger/ops/audits?limit=50');
    if ($('gwAuditTable')) $('gwAuditTable').innerHTML = table(
      [{label:'时间', key:'created_at'}, {label:'Client', key:'client_id'}, {label:'租户', key:'tenant_id'}, {label:'方法', key:'method'},
       {label:'路径', key:'path', mono:true}, {label:'状态', key:'status'}, {label:'来源', key:'remote_addr'}],
      j.data || []
    );
  } catch (e) { if ($('gwAuditTable')) $('gwAuditTable').innerHTML = '<p class="muted">' + esc(e.message) + '</p>'; }
  try {
    const j = await api('/api/v1/ledger/ops/actions?limit=50');
    if ($('opsActionTable')) $('opsActionTable').innerHTML = table(
      [{label:'时间', key:'created_at'}, {label:'操作人', key:'operator'}, {label:'动作', key:'action'},
       {label:'目标', key:'target', mono:true}, {label:'详情', key:'detail'}],
      j.data || []
    );
  } catch (e) { if ($('opsActionTable')) $('opsActionTable').innerHTML = '<p class="muted">' + esc(e.message) + '</p>'; }
  try {
    const j = await api('/api/v1/ledger/ops/alerts?limit=50');
    if ($('alertTable')) $('alertTable').innerHTML = table(
      [{label:'时间', key:'at'}, {label:'系统', key:'source_system'}, {label:'持有人', key:'holder_id', mono:true},
       {label:'资产', key:'asset_code'}, {label:'命令', key:'command'}, {label:'原因', key:'reason'}],
      j.data || []
    );
  } catch (e) { if ($('alertTable')) $('alertTable').innerHTML = '<p class="muted">' + esc(e.message) + '</p>'; }
}

window.addEventListener('hashchange', () => { try { render(); } catch (e) { toast(e.message, true); } });
window.addEventListener('unhandledrejection', ev => toast(String(ev.reason && ev.reason.message || ev.reason), true));

async function boot() {
  $('token').value = localStorage.getItem(TOKEN_KEY) || '';
  if ($('operator')) $('operator').value = localStorage.getItem(OP_KEY) || 'console';
  try {
    await loadOverview();
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    if (!location.hash) location.hash = '#/dashboard';
    render();
  } catch (e) {
    showLogin();
    if (e.message && e.message !== '未授权') toast(e.message, true);
  }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && $('login') && !$('login').classList.contains('hidden')) unlock();
});
boot();
</script>
</body>
</html>
