app:
  name: ledger-hub
  env: docker
  default_tenant: t_default
  reconcile_dir: /tmp/ledger-reconcile

http:
  api_addr: ":8080"
  gateway_addr: ":8088"
  worker_addr: ":8089"
  read_timeout: 10s
  write_timeout: 15s
  shutdown_timeout: 10s

mysql:
  dsn: "root:root@tcp(mysql:3306)/ledger_hub?charset=utf8mb4&parseTime=True&loc=Local"
  shards: []
  max_idle_conns: 10
  max_open_conns: 50
  conn_max_lifetime: 30m

log:
  level: info
  encoding: console

gateway:
  upstream: "http://api:8080"
  rate_limit_rps: 200
  max_skew_seconds: 300
  console_token: "dev-console-token"
  clients:
    - client_id: order
      secret: "dev-secret-order"
    - client_id: pay
      secret: "dev-secret-pay"
    - client_id: campaign
      secret: "dev-secret-campaign"
    - client_id: wallet
      secret: "dev-secret-wallet"

acl:
  rules:
    - source_system: campaign
      commands: ["Credit"]
      assets: ["POINT"]
    - source_system: order
      commands: ["Freeze", "Capture", "Release"]
      assets: ["POINT", "BALANCE_CNY"]
    - source_system: pay
      commands: ["Credit"]
      assets: ["BALANCE_CNY"]
    - source_system: wallet
      commands: ["Credit", "Debit", "Freeze", "Capture", "Release", "Transfer", "Exchange", "Reverse"]
      assets: ["POINT", "BALANCE_CNY", "BALANCE_USD"]
    - source_system: worker
      commands: ["Release", "Debit", "Transfer", "Reverse"]
      assets: ["*"]

connector:
  addr: ":8090"
  ledger_base_url: "http://gateway:8088"

worker:
  freeze_expire_interval: 30s
  reconcile_interval: 1h
  asset_expire_interval: 24h

limits:
  rules:
    - source_system: wallet
      asset_code: "*"
      command: Exchange
      max_amount: 100000000
      daily_amount: 1000000000
      daily_count: 1000
    - source_system: wallet
      asset_code: POINT
      command: Debit
      max_amount: 80
